services:
  - type: web
    name: orca-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_PATH
        value: ./data/decisions.db
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: ALLOWED_ORIGINS
        value: "https://orca-black.vercel.app"

